  <style>

<body>

  <main class="app">

    <div class="header-box">
      <h1>Judul</h1>
    </div>


    <section id="message" class="message hidden"></section>


    <!-- ========================================================
         LAYAR LOGIN
         Hanya muncul jika belum verifikasi
         ======================================================== -->

    <section id="setupView" class="card">

      <div
        style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;"
      >

          for="nip"

        >

      >

    <!-- ========================================================

      <!-- Header Informasi Pegawai -->

        </span>

        </span>
      </div>


      <!-- Tombol Navigasi 4 Tab -->

        <button

        >

        </button>

        >

        </button>

      <!-- ======================================================
           TAB ABSENSI
           ====================================================== -->

      <div

      >

        <div

    <footer>

  </main>


  <script>
    // ==========================================================
    // API CONFIGURATION
    // ==========================================================

    // PENTING:
    // Ganti dengan URL Web App Apps Script Anda
    // yang baru dari Google Apps Script.

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxS2KVFhhD60FYMuRnCNlC3xfhVrdg5K1WNEbPljEh3aPb_WaUuYqYfXFaSaOm57R2Ifg/exec";

    const NIP_KEY = "absensi_v5_nip";
    const DEV_KEY = "absensi_v5_device";
    const VERIFIED_KEY = "absensi_v5_verified";
    const EMPLOYEE_KEY = "absensi_v5_employee";


    // ==========================================================
    // GLOBAL VARIABLES
    // ==========================================================

    let pending = null;

    const $ = id =>
      document.getElementById(id);


    // ==========================================================
    // INITIALIZATION
    // ==========================================================

    document.addEventListener(
      "DOMContentLoaded",
      init
    );


    async function init() {

      [
        "cekBtn",
        "simpanBtn",
        "ulangiBtn",
        "gpsBtn",
        "masukBtn",
        "keluarBtn"
      ].forEach(id => {
        $(id)?.addEventListener(
          "click",
          () => handlers[id]()
        );
      });


      document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {
          btn.addEventListener(
            "click",
            e => switchTab(
              e.target.dataset.tab
            )
          );
        });


      const nip =
        localStorage.getItem(NIP_KEY);

      const deviceId =
        localStorage.getItem(DEV_KEY);


      if (!nip || !deviceId) {
        showVerify();
        return;
      }


      try {

        const result = await api({
          action: "getSession",
          nip,
          deviceId
        });


        if (result.ok) {
          saveSession(result.employee);
          showAttendance(result.employee);
          return;
        }


        clearSession();
        showVerify();

        msg(
          result.message,
          "error"
        );

      } catch (error) {

        const cachedEmployee =
          loadCachedEmployee();


        if (cachedEmployee) {

          showAttendance(
            cachedEmployee
          );

          msg(
            "Sesi tersimpan. Server offline.",
            "error"
          );

        } else {

          showVerify();

          msg(
            error.message,
            "error"
          );
        }
      }
    }


    // ==========================================================
    // EVENT HANDLERS
    // ==========================================================

    const handlers = {
      cekBtn: verifyNip,
      simpanBtn: confirmVerification,
      ulangiBtn: resetSetup,
      gpsBtn: checkGps,
      masukBtn: () =>
        attendance("MASUK"),
      keluarBtn: () =>
        attendance("KELUAR")
    };


    // ==========================================================
    // DEVICE
    // ==========================================================

    function device() {

      let deviceId =
        localStorage.getItem(DEV_KEY);


      if (!deviceId) {

        deviceId =
          "DEV-" +
          (
            crypto.randomUUID
              ? crypto.randomUUID()
              : Math.random()
                  .toString(36)
                  .slice(2) +
                Date.now()
          );


        localStorage.setItem(
          DEV_KEY,
          deviceId
        );
      }


      return deviceId;
    }


    // ==========================================================
    // VERIFY NIP
    // ==========================================================

    async function verifyNip() {

      const nip =
        $("nip").value.trim();


      if (!nip) {
        return msg(
          "NIP wajib diisi.",
          "error"
        );
      }


      busy(
        "cekBtn",
        true,
        "Memeriksa..."
      );


      try {

        const result = await api({
          action: "verifyNip",
          nip,
          deviceId: device()
        });


        if (!result.ok) {
          return msg(
            result.message,
            "error"
          );
        }


        pending =
          result.employee;


        $("lblNama").textContent =
          pending.nama;

        $("lblBagian").textContent =
          pending.bagian;

        $("lblJabatan").textContent =
          pending.jabatan;


        $("cekBtn")
          .classList
          .add("hidden");

        $("dataPegawai")
          .classList
          .remove("hidden");

        $("nip").disabled = true;


        msg("", "");

      } catch (error) {

        msg(
          error.message,
          "error"
        );

      } finally {

        busy(
          "cekBtn",
          false,
          "CEK NIP"
        );
      }
    }


    // ==========================================================
    // RESET SETUP
    // ==========================================================

    function resetSetup() {

      pending = null;

      $("nip").value = "";
      $("nip").disabled = false;

      $("dataPegawai")
        .classList
        .add("hidden");

      $("cekBtn")
        .classList
        .remove("hidden");

      msg("", "");
    }


    // ==========================================================
    // CONFIRM VERIFICATION
    // ==========================================================

    async function confirmVerification() {

      if (!pending) {
        return;
      }


      busy(
        "simpanBtn",
        true,
        "Menyimpan..."
      );


      try {

        const result =
          await api({
            action:
              "confirmVerification",

            nip:
              pending.nip,

            deviceId:
              device()
          });


        if (!result.ok) {
          return msg(
            result.message,
            "error"
          );
        }


        saveSession(
          result.employee ||
          pending
        );


        showAttendance(
          result.employee ||
          pending
        );


        msg(
          "Verifikasi berhasil.",
          "success"
        );

      } catch (error) {

        msg(
          error.message,
          "error"
        );

      } finally {

        busy(
          "simpanBtn",
          false,
          "Simpan"
        );
      }
    }


    // ==========================================================
    // SESSION
    // ==========================================================

    function saveSession(employee) {

      if (
        !employee ||
        !employee.nip
      ) {
        return;
      }


      localStorage.setItem(
        NIP_KEY,
        employee.nip
      );

      localStorage.setItem(
        VERIFIED_KEY,
        "1"
      );

      localStorage.setItem(
        EMPLOYEE_KEY,
        JSON.stringify(employee)
      );
    }


    function loadCachedEmployee() {

      try {

        const raw =
          localStorage.getItem(
            EMPLOYEE_KEY
          );

        return raw
          ? JSON.parse(raw)
          : null;

      } catch (e) {

        return null;
      }
    }


    function clearSession() {

      localStorage.removeItem(
        NIP_KEY
      );

      localStorage.removeItem(
        DEV_KEY
      );

      localStorage.removeItem(
        VERIFIED_KEY
      );

      localStorage.removeItem(
        EMPLOYEE_KEY
      );


      pending = null;
    }


    // ==========================================================
    // VIEW
    // ==========================================================

    function showVerify() {

      $("setupView")
        .classList
        .remove("hidden");

      $("attendanceView")
        .classList
        .add("hidden");

      resetSetup();
    }


    function showAttendance(employee) {

      if (!employee) {
        return showVerify();
      }


      $("setupView")
        .classList
        .add("hidden");

      $("attendanceView")
        .classList
        .remove("hidden");


      // Format Tanggal:
      // "3 Okt 2026"

      const dateStr =
        new Date()
          .toLocaleDateString(
            "id-ID",
            {
              day: "numeric",
              month: "short",
              year: "numeric"
            }
          );


      // Ambil nama panggilan
      // (kata pertama)

      const firstName =
        employee.nama.split(" ")[0];


      // Isi data ke Header
      // Sesuai Wireframe

      $("headerUser").textContent =
        `${firstName} - ${employee.bagian} - ${employee.jabatan}`;

      $("headerDate").textContent =
        dateStr;


      switchTab("absen");
    }


    // ==========================================================
    // TAB NAVIGATION
    // ==========================================================

    function switchTab(tabName) {

      document
        .querySelectorAll(".tab-btn")
        .forEach(b => {
          b.classList.toggle(
            "active",
            b.dataset.tab === tabName
          );
        });


      document
        .querySelectorAll(".tab-content")
        .forEach(c => {
          c.classList.remove(
            "active"
          );
        });


      if (tabName === "absen") {

        $("tab-absen")
          .classList
          .add("active");

      } else {

        $("tab-dynamic")
          .classList
          .add("active");

        fetchDynamicContent(
          tabName.toUpperCase()
        );
      }
    }


    // ==========================================================
    // DYNAMIC CONTENT
    // ==========================================================

    async function fetchDynamicContent(type) {

      $("dynamicDesc").textContent =
        "Memuat informasi dari server...";

      $("dynamicList").innerHTML = "";


      try {

        const res =
          await api({
            action: "getContent",
            contentType: type
          });


        if (res.ok) {

          $("dynamicDesc").textContent =
            res.deskripsi;


          // Merender kotak-kotak
          // sub-menu

          $("dynamicList").innerHTML =
            res.items
              .map(
                item => `
                  <a
                    href="${item.url || "#"}"
                    target="_blank"
                    rel="noopener"
                    class="sub-item"
                  >
                    ${esc(item.judul)}
                  </a>
                `
              )
              .join("");

        } else {

          $("dynamicDesc").textContent =
            res.message;
        }

      } catch (e) {

        $("dynamicDesc").textContent =
          "Gagal memuat data. Periksa koneksi internet Anda.";
      }
    }


    // ==========================================================
    // ATTENDANCE
    // ==========================================================

    async function attendance(type) {

      const nip =
        localStorage.getItem(
          NIP_KEY
        );

      const deviceId =
        localStorage.getItem(
          DEV_KEY
        );


      if (!nip || !deviceId) {
        return showVerify();
      }


      $("gpsStatus").textContent =
        "Meminta lokasi GPS...";


      $("masukBtn").disabled = true;
      $("keluarBtn").disabled = true;


      try {

        const positionData =
          await position();


        const result =
          await api({
            action:
              "submitAttendance",

            type,
            nip,
            deviceId,

            latitude:
              positionData.coords.latitude,

            longitude:
              positionData.coords.longitude,

            accuracy:
              positionData.coords.accuracy,

            browser:
              navigator.userAgent,

            os: os()
          });


        attendanceMsg(
          result.message,
          result.ok
            ? "success"
            : "error"
        );

      } catch (error) {

        attendanceMsg(
          error.message,
          "error"
        );

      } finally {

        $("masukBtn").disabled =
          false;

        $("keluarBtn").disabled =
          false;
      }
    }


    // ==========================================================
    // CHECK GPS
    // ==========================================================

    async function checkGps() {

      busy(
        "gpsBtn",
        true,
        "Mencari..."
      );


      try {

        const pos =
          await position();


        $("gpsStatus").textContent =
          "GPS aktif. Akurasi ±" +
          Math.round(
            pos.coords.accuracy
          ) +
          " meter.";

      } catch (error) {

        $("gpsStatus").textContent =
          "GPS gagal: " +
          error.message;

      } finally {

        busy(
          "gpsBtn",
          false,
          "CEK / AKTIFKAN GPS"
        );
      }
    }


    // ==========================================================
    // GEOLOCATION
    // ==========================================================

    function position() {

      return new Promise(
        (resolve, reject) => {

          if (!navigator.geolocation) {
            return reject(
              Error(
                "GPS tidak didukung perangkat ini."
              )
            );
          }


          navigator.geolocation.getCurrentPosition(
            resolve,

            error => {
              reject(
                Error(
                  error.code === 1
                    ? "Izin lokasi ditolak."
                    : error.code === 2
                    ? "Lokasi mati."
                    : "Timeout."
                )
              );
            },

            {
              enableHighAccuracy: true,
              timeout: 15000,
              maximumAge: 0
            }
          );
        }
      );
    }


    // ==========================================================
    // API REQUEST
    // ==========================================================

    async function api(payload) {

      if (
        API_URL.includes(
          "PASTE_APPS_SCRIPT"
        )
      ) {
        throw Error(
          "API_URL belum diisi dengan URL dari Google Apps Script."
        );
      }


      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload)
          }
        );


      const text =
        await response.text();


      try {

        return JSON.parse(text);

      } catch (error) {

        throw Error(
          "Respons gagal diproses."
        );
      }
    }


    // ==========================================================
    // UTILITY
    // ==========================================================

    function esc(value) {

      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,

        m =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[m])
      );
    }


    function busy(
      id,
      isBusy,
      text
    ) {

      $(id).disabled =
        isBusy;

      $(id).textContent =
        text;
    }


    function msg(
      text,
      type
    ) {

      const el =
        $("message");

      el.textContent =
        text || "";

      el.className =
        text
          ? "message " + type
          : "message hidden";
    }


    function attendanceMsg(
      text,
      type
    ) {

      const el =
        $("attendanceMessage");

      el.textContent =
        text || "";

      el.className =
        text
          ? "message " + type
          : "message hidden";
    }


    // ==========================================================
    // OPERATING SYSTEM
    // ==========================================================

    function os() {

      const ua =
        navigator.userAgent;


      if (/Android/i.test(ua)) {
        return "Android";
      }


      if (
        /iPhone|iPad|iPod/i.test(ua)
      ) {
        return "iOS";
      }


      if (/Windows/i.test(ua)) {
        return "Windows";
      }


      return "Unknown";
    }
  </script>

</body>

</html>
